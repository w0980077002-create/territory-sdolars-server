<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Territory — Sdolars</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070a0d;color:#fff;font-family:Arial,sans-serif;touch-action:none}
#game{position:relative;width:100%;height:100%;overflow:hidden;background:#273943}
#scene{position:absolute;inset:0 0 116px 0;overflow:hidden;background:linear-gradient(#688b9c 0 42%,#40584d 43% 60%,#222b2b 61%)}
.city{position:absolute;left:0;right:0;bottom:24%;height:39%;background:
linear-gradient(90deg,#293238 0 13%,transparent 13% 17%,#41494e 17% 29%,transparent 29% 34%,#292f34 34% 50%,transparent 50% 55%,#485057 55% 70%,transparent 70% 74%,#2d3439 74% 91%,transparent 91%),
linear-gradient(#59636a,#252c30)}
.street{position:absolute;left:-10%;right:-10%;bottom:-14%;height:49%;transform:skewY(-6deg);background:linear-gradient(#4a5355,#242a2b 60%,#161a1c)}
.lamp{position:absolute;bottom:28%;width:5px;height:145px;background:#121619}.lamp:before{content:"";position:absolute;top:-8px;left:-7px;width:19px;height:19px;border-radius:50%;background:#ffe3a0;box-shadow:0 0 24px #ffd56a}.l1{left:12%}.l2{right:14%;height:120px}
.char{position:absolute;bottom:27%;width:96px;height:185px;filter:drop-shadow(0 7px 5px #0009);animation:idle 1.1s infinite}
.head{position:absolute;top:12px;left:31px;width:36px;height:38px;border-radius:48%;background:#c98e6d;border:2px solid #3b2923}.hair{position:absolute;top:7px;left:27px;width:45px;height:28px;border-radius:50% 50% 20% 20%;background:#302720}
.body{position:absolute;top:51px;left:21px;width:54px;height:78px;border-radius:12px;background:#4d5960;border:2px solid #14191d}.belt{position:absolute;top:104px;left:21px;width:54px;height:8px;background:#b08a47}
.leg{position:absolute;top:124px;width:22px;height:61px;background:#293238;border:2px solid #111;transform-origin:top}.leg.a{left:23px}.leg.b{left:52px}
.arm{position:absolute;top:56px;width:18px;height:70px;background:#39464d;border:2px solid #111;transform-origin:top}.arm.a{left:9px;transform:rotate(18deg)}.arm.b{right:9px;transform:rotate(-18deg)}
.weapon{position:absolute;right:0;top:76px;width:8px;height:76px;background:#dfe7eb;border-radius:5px;transform:rotate(-38deg);box-shadow:0 0 7px #fff}
.hero{left:13%}.enemy{right:13%;transform:scaleX(-1)}.hero .body{background:#72503d}.enemy .body{background:#52383e}
@keyframes idle{0%,100%{translate:0 0}50%{translate:0 -3px}}
@keyframes attack{0%{translate:0 0}45%{translate:55px 0}70%{translate:48px -2px}100%{translate:0 0}}
@keyframes hit{0%,100%{translate:0 0}30%{translate:14px 0}60%{translate:-7px 0}}
.attacking{animation:attack .45s ease!important}.hit{animation:hit .32s ease!important}
#slash{position:absolute;width:105px;height:4px;background:#fff;box-shadow:0 0 13px #d7f2ff;opacity:0;pointer-events:none;transform:rotate(-30deg)}
@keyframes slash{0%{opacity:0;translate:0 0}30%{opacity:1}100%{opacity:0;translate:45px -30px}}
.slashing{animation:slash .32s ease}
#damage{position:absolute;font-size:30px;font-weight:900;color:#ffd24e;text-shadow:2px 2px #000;opacity:0}
@keyframes dmg{0%{opacity:0;translate:0 10px}25%,70%{opacity:1}100%{opacity:0;translate:0 -45px}}.showdamage{animation:dmg .7s ease}
#hud{position:absolute;top:env(safe-area-inset-top);left:0;right:0;height:68px;padding:7px;display:flex;align-items:center;gap:6px;z-index:10;background:linear-gradient(#070b10dd,transparent)}
.badge{background:#111923e8;border:1px solid #65727b;border-radius:9px;padding:6px 8px;font-size:12px}.hp{width:92px;height:12px;background:#32161a;border:1px solid #111;border-radius:8px;overflow:hidden}.hp i{display:block;height:100%;width:100%;background:#c7373f;transition:width .25s}
.icons{margin-left:auto;display:flex;gap:5px}.ico{width:33px;height:33px;border-radius:9px;border:1px solid #697780;background:#172128;color:#fff}
.enemyhp{position:absolute;z-index:10;top:78px;left:22%;right:22%;height:15px;border:2px solid #101316;border-radius:10px;background:#341519;overflow:hidden}.enemyhp i{display:block;height:100%;width:100%;background:#d63d43;transition:width .25s}
#side{position:absolute;right:7px;top:108px;z-index:11;display:flex;flex-direction:column;gap:7px}.sidebtn{width:39px;height:39px;border-radius:11px;border:1px solid #69777e;background:#172128dd;color:#fff}
#log{position:absolute;left:10px;bottom:225px;z-index:11;font-size:11px;text-shadow:1px 1px #000;color:#eef2f3}
#combat{position:absolute;z-index:12;left:7px;right:7px;bottom:116px;padding:8px;background:#091017e8;border:1px solid #5c6971;border-radius:14px}.title{font-size:10px;color:#bdc8cc;margin-bottom:5px}.row{display:flex;gap:5px}.zone{flex:1;min-width:0;padding:8px 1px;border-radius:8px;border:1px solid #56636b;background:#182228;color:#fff;font-size:10px}.zone.sel{background:#916327;border-color:#f0c46a}.zone.block.sel{background:#633238}
#attackBtn{margin-top:7px;width:100%;height:42px;border:0;border-radius:10px;background:linear-gradient(#c28b3b,#74501f);color:#fff;font-weight:900;font-size:15px}
#bottom{position:absolute;z-index:15;left:0;right:0;bottom:0;height:116px;padding:7px;background:linear-gradient(#111a20,#080b0f);border-top:1px solid #4c5960}.tabs{display:flex;gap:5px}.tab{height:43px;flex:1;border:1px solid #4e5a61;border-radius:10px;background:#172027;color:#e2e7e9;font-size:10px}.tab.active{background:#765225;border-color:#dfb45e}
.panel{display:none}.panel.open{display:block;position:absolute;left:7px;right:7px;bottom:51px;padding:10px;background:#0a1117f2;border:1px solid #65727a;border-radius:12px;font-size:12px;z-index:20}
</style>
</head>
<body>
<div id="game">
<div id="scene">
<div class="city"></div><div class="street"></div><div class="lamp l1"></div><div class="lamp l2"></div>
<div class="char hero" id="hero"><div class="hair"></div><div class="head"></div><div class="body"></div><div class="belt"></div><div class="arm a"></div><div class="arm b"></div><div class="leg a"></div><div class="leg b"></div><div class="weapon"></div></div>
<div class="char enemy" id="enemy"><div class="hair"></div><div class="head"></div><div class="body"></div><div class="belt"></div><div class="arm a"></div><div class="arm b"></div><div class="leg a"></div><div class="leg b"></div><div class="weapon"></div></div>
<div id="slash"></div><div id="damage">-12</div>
</div>
<div id="hud"><div class="badge"><b>TERRITORY</b></div><div class="badge">LVL 7</div><div class="badge">♥ <span id="hptext">120</span></div><div class="hp"><i id="myhp"></i></div><div class="icons"><button class="ico">☰</button><button class="ico">⚙</button></div></div>
<div class="enemyhp"><i id="enemyhp"></i></div>
<div id="side"><button class="sidebtn">⚔</button><button class="sidebtn">🎒</button><button class="sidebtn">★</button><button class="sidebtn">⚑</button></div>
<div id="log">Выбери атаку и две зоны защиты.</div>
<div id="combat">
<div class="title">АТАКА — выбери зону</div>
<div class="row" id="attacks"><button class="zone sel">Голова</button><button class="zone">Грудь</button><button class="zone">Живот</button><button class="zone">Пояс</button><button class="zone">Ноги</button></div>
<div class="title" style="margin-top:7px">ЗАЩИТА — выбери 2 зоны</div>
<div class="row" id="blocks"><button class="zone block">Голова</button><button class="zone block">Грудь</button><button class="zone block">Живот</button><button class="zone block">Пояс</button><button class="zone block">Ноги</button></div>
<button id="attackBtn">АТАКОВАТЬ</button>
</div>
<div id="bottom"><div class="tabs">
<button class="tab active">⚔ Бой</button><button class="tab">🛡 Снаряжение</button><button class="tab">👤 Герой</button><button class="tab">🗺 Районы</button><button class="tab">💬 Чат</button>
</div></div>
</div>
<script>
const KEY="territory_save";
let s=JSON.parse(localStorage.getItem(KEY)||"null")||{hp:120,maxHp:120,enemyHp:100,coins:1000,level:7,exp:0,attack:12};
const q=x=>document.querySelector(x), qa=x=>[...document.querySelectorAll(x)];
const attacks=qa("#attacks .zone"), blocks=qa("#blocks .zone");
attacks.forEach(b=>b.onclick=()=>{attacks.forEach(x=>x.classList.remove("sel"));b.classList.add("sel")});
blocks.forEach(b=>b.onclick=()=>{if(b.classList.contains("sel"))b.classList.remove("sel");else if(blocks.filter(x=>x.classList.contains("sel")).length<2)b.classList.add("sel")});
function save(){localStorage.setItem(KEY,JSON.stringify(s));q("#myhp").style.width=s.hp/s.maxHp*100+"%";q("#hptext").textContent=s.hp;q("#enemyhp").style.width=s.enemyHp+"%"}
function log(t){q("#log").textContent=t}
q("#attackBtn").onclick=()=>{
 const bs=blocks.filter(x=>x.classList.contains("sel")); if(bs.length!==2){log("Нужно выбрать ровно 2 зоны защиты.");return}
 const hero=q("#hero"),enemy=q("#enemy"),slash=q("#slash"),dmg=q("#damage");
 hero.classList.remove("attacking");void hero.offsetWidth;hero.classList.add("attacking");
 setTimeout(()=>{
   const hit=s.attack+Math.floor(Math.random()*6);s.enemyHp=Math.max(0,s.enemyHp-hit);
   enemy.classList.remove("hit");void enemy.offsetWidth;enemy.classList.add("hit");
   dmg.textContent="-"+hit;dmg.style.left="68%";dmg.style.top="42%";dmg.classList.remove("showdamage");void dmg.offsetWidth;dmg.classList.add("showdamage");
   slash.style.left="48%";slash.style.top="47%";slash.classList.remove("slashing");void slash.offsetWidth;slash.classList.add("slashing");save();
   if(s.enemyHp===0){s.coins+=50;log("Победа! +50 монет.");setTimeout(()=>{s.enemyHp=100;save();log("Новый противник.");},900)}
   else setTimeout(()=>{const blocked=bs.some(x=>x.classList.contains("sel"));const hit2=blocked?Math.floor(Math.random()*7):8+Math.floor(Math.random()*8);s.hp=Math.max(0,s.hp-hit2);save();log(blocked?"Защита сработала.":"Противник попал!");if(s.hp===0){s.hp=s.maxHp;s.enemyHp=100;save();log("Раунд проигран. Здоровье восстановлено.");}},650)
 },280)
};
qa(".tab").forEach((b,i)=>b.onclick=()=>{qa(".tab").forEach(x=>x.classList.remove("active"));b.classList.add("active");log(["Бой","Снаряжение: оружие и защита","Герой: характеристики и прогресс","Районы Sdolars","Чат: интерфейс готов"][i])});
save();
</script>
</body>
</html>
