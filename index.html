<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Territory — Sdolars</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#18232b;font-family:Arial,sans-serif;color:#fff}
#game{width:100vw;height:100vh;max-width:720px;margin:auto;position:relative;overflow:hidden;background:#78b7d1}
canvas{position:absolute;inset:0;width:100%;height:100%}
.hud{position:absolute;top:8px;left:8px;right:8px;display:flex;gap:7px;align-items:center;z-index:5}
.avatar{width:52px;height:52px;border-radius:14px;background:#56372d;border:3px solid #e5b75e;display:flex;align-items:center;justify-content:center;font-size:29px}
.stat{flex:1;min-width:0}.name{font-weight:800;font-size:14px;text-shadow:1px 2px #000}.bar{height:10px;background:#30272a;border:1px solid #111;border-radius:8px;overflow:hidden;margin:2px 0}.hp{height:100%;background:#e83e35;width:100%}.xp{height:100%;background:#29a7e8;width:45%}
.money{background:#161a1cdd;border:2px solid #56616a;border-radius:12px;padding:7px 9px;font-size:12px;white-space:nowrap}
.side{position:absolute;top:105px;z-index:5;display:flex;flex-direction:column;gap:9px}.left{left:7px}.right{right:7px}
.icon{width:58px;height:58px;border:2px solid #29343a;border-radius:15px;background:#ead7a8;color:#171b1d;box-shadow:0 3px 0 #1118;font-weight:800;font-size:10px;padding:3px}.icon b{font-size:24px;display:block}.icon.warn{outline:3px solid #e9483f}
.bottom{position:absolute;left:7px;right:7px;bottom:7px;z-index:8}
.items{display:flex;gap:6px;overflow:hidden;background:#24292bdd;border:2px solid #5e6468;border-radius:15px;padding:7px}
.item{min-width:66px;height:66px;border-radius:10px;border:2px solid #9d76e8;background:#513b74;display:flex;align-items:center;justify-content:center;flex-direction:column;font-weight:800;font-size:11px}.item:nth-child(2n){background:#31546d;border-color:#5bc6e7}.item span{font-size:27px}
.quest{margin-top:6px;background:#2d2825ee;border:2px solid #8d7656;border-radius:12px;padding:8px;font-size:12px;display:flex;justify-content:space-between;align-items:center}.quest button{background:#d79b42;border:2px solid #ffe0a0;border-radius:9px;padding:8px 15px;font-weight:900}
.nav{display:flex;gap:4px;margin-top:6px}.nav button{flex:1;height:54px;border:2px solid #454c51;border-radius:12px;background:#171d21;color:#ddd;font-weight:800;font-size:11px}.nav button.active{background:#c58b3d;color:#fff;border-color:#ffe0a0}
.attack{position:absolute;bottom:145px;left:10px;width:92px;height:92px;border-radius:50%;z-index:7;background:#e83c31;border:6px solid #ffb5a5;box-shadow:0 4px 0 #66140f;font-size:38px;color:#fff}.defend{position:absolute;bottom:145px;right:10px;width:92px;height:92px;border-radius:50%;z-index:7;background:#22aee5;border:6px solid #a9e9ff;box-shadow:0 4px 0 #075b7c;font-size:38px}
.log{position:absolute;top:68px;left:50%;transform:translateX(-50%);z-index:6;background:#172126cc;border:2px solid #64747b;border-radius:10px;padding:5px 12px;font-size:12px;white-space:nowrap}
#flash{position:absolute;inset:0;background:#fff;opacity:0;z-index:20;pointer-events:none}
#toast{position:absolute;top:48%;left:50%;transform:translate(-50%,-50%);font-size:34px;font-weight:900;color:#ffe05a;text-shadow:3px 3px #7b2118;opacity:0;z-index:20;pointer-events:none}
</style>
</head>
<body>
<div id="game">
<canvas id="c"></canvas><div id="flash"></div><div id="toast">−421</div>
<div class="hud">
 <div class="avatar">🧔</div><div class="stat"><div class="name">Варг · Ур. 12</div><div class="bar"><div class="hp" id="hp"></div></div><div class="bar"><div class="xp"></div></div></div>
 <div class="money">🪙 12,450<br>💎 25</div>
</div>
<div class="log" id="log">Sdolars · Центральный район</div>
<div class="side left">
 <button class="icon warn"><b>📜</b>Задания</button><button class="icon"><b>🎁</b>События</button><button class="icon"><b>🏆</b>Рейтинг</button><button class="icon"><b>⚔️</b>Гильдия</button><button class="icon"><b>💬</b>Чат</button>
</div>
<div class="side right">
 <button class="icon"><b>🗺️</b>Карта</button><button class="icon warn"><b>🛡️</b>Рынок</button><button class="icon"><b>⚔️</b>Арена</button><button class="icon"><b>🎒</b>Инвентарь</button><button class="icon"><b>⚙️</b>Настройки</button>
</div>
<div class="attack" id="atk">⚔</div><div class="defend" id="def">🛡</div>
<div class="bottom">
 <div class="items">
  <div class="item"><span>🪓</span>УР.10</div><div class="item"><span>🏹</span>УР.8</div><div class="item"><span>🗡️</span>УР.7</div><div class="item"><span>🧪</span>x23</div><div class="item"><span>🥩</span>x12</div><div class="item"><span>👢</span>УР.5</div>
 </div>
 <div class="quest"><span>📜 Пройти Центральный район 3–5<br><b>Прогресс: <span id="prog">2/5</span></b></span><button id="go">ПЕРЕЙТИ</button></div>
 <div class="nav"><button>🪖<br>Персонаж</button><button>📖<br>Навыки</button><button class="active">⚔️<br>Бой</button><button>🎒<br>Рюкзак</button><button>🏰<br>Город</button><button>🗺️<br>Районы</button></div>
</div>
</div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');let dpr=1,W,H,t=0,enemyHP=100,playerHP=100,attack=false;
function resize(){dpr=devicePixelRatio||1;W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
function rr(a,b,w,h,r,fill){x.fillStyle=fill;x.beginPath();x.roundRect(a,b,w,h,r);x.fill()}
function bg(){let g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#79bdd7');g.addColorStop(.55,'#5c8791');g.addColorStop(1,'#35474b');x.fillStyle=g;x.fillRect(0,0,W,H);
 for(let i=0;i<9;i++){let bx=i*100-20;let bh=110+(i%4)*45;x.fillStyle=['#526d76','#405963','#627b81'][i%3];x.fillRect(bx,H*.43-bh,75,bh);x.fillStyle='#d9c18a';for(let q=0;q<4;q++)x.fillRect(bx+10+q*16,H*.43-bh+30,8,13)}
 x.fillStyle='#394348';x.fillRect(0,H*.43,W,H*.57);for(let i=0;i<14;i++){x.fillStyle=i%2?'#566064':'#424c50';x.fillRect((i*83+t*.4)%W,H*.56+(i%5)*55,65,8)}
 // dock
 x.fillStyle='#6b503c';x.fillRect(0,H*.58,W,16);x.fillStyle='#c88b49';for(let i=0;i<7;i++)x.fillRect(i*115,H*.64,70,7)
 // flags
 x.fillStyle='#9f2630';x.fillRect(W*.55,H*.28,55,70);x.fillStyle='#f0c15a';x.font='28px Arial';x.fillText('⚔',W*.55+10,H*.28+45)
}
function hero(cx,cy,s,enemy=false,phase=0){x.save();x.translate(cx,cy);let bob=Math.sin(phase*5)*3; x.translate(0,bob);
 // shadow
 x.fillStyle='#1118';x.beginPath();x.ellipse(0,55,48,12,0,0,Math.PI*2);x.fill();
 // legs
 x.strokeStyle=enemy?'#493a35':'#332b26';x.lineWidth=16;x.lineCap='round';x.beginPath();x.moveTo(-18,20);x.lineTo(-25,57);x.moveTo(18,20);x.lineTo(25,57);x.stroke();
 // body
 x.fillStyle=enemy?'#596147':'#62442f';x.beginPath();x.roundRect(-34,-35,68,70,18);x.fill();
 // arms
 x.strokeStyle=x.fillStyle;x.lineWidth=18;x.beginPath();x.moveTo(-28,-20);x.lineTo(-52,8);x.moveTo(28,-20);x.lineTo(52,8);x.stroke();
 // head
 x.fillStyle=enemy?'#70805b':'#c18763';x.beginPath();x.arc(0,-57,25,0,Math.PI*2);x.fill();
 // beard/hood
 x.fillStyle=enemy?'#25272a':'#30251f';x.beginPath();x.moveTo(-25,-68);x.quadraticCurveTo(0,-92,25,-68);x.lineTo(20,-45);x.quadraticCurveTo(0,-32,-20,-45);x.fill();
 // weapon
 x.save();let swing=attack&&!enemy?Math.sin(Math.min(1,(t%2)/.5)*Math.PI)*1.15:0;x.rotate(enemy?-.8:swing-.45);x.fillStyle='#c9d0d3';x.fillRect(32,-6,72,10);x.fillStyle='#765039';x.fillRect(20,-8,32,14);x.restore();
 x.fillStyle='#fff';x.font='bold 15px Arial';x.textAlign='center';x.fillText(enemy?'Разбойник':'Варг',0,-102);x.restore()}
function hpbar(cx,cy,val,col,name){rr(cx-65,cy,130,12,6,'#182126');rr(cx-63,cy+2,126*val/100,8,4,col);x.fillStyle='#fff';x.font='bold 11px Arial';x.textAlign='center';x.fillText(name+' '+Math.max(0,Math.round(val))+'%',cx,cy+10)}
function frame(){t+=1/60;bg();let center=H*.49, sep=W*.5;
 let hit=attack?Math.min(1,(t%2)/.5):0;let hx=W*.34+hit*45, ex=W*.68-hit*28;
 hero(hx,center,1,false,t);hero(ex,center+5,1,true,t);
 hpbar(hx,center-125,playerHP,'#27c943','Варг');hpbar(ex,center-125,enemyHP,'#e13c36','Враг');
 requestAnimationFrame(frame)}frame();
function doAttack(){if(enemyHP<=0)return;attack=true;document.getElementById('log').textContent='Варг атакует разбойника!';setTimeout(()=>{enemyHP=Math.max(0,enemyHP-18);document.getElementById('toast').style.opacity=1;document.getElementById('flash').style.opacity=.22;setTimeout(()=>{document.getElementById('toast').style.opacity=0;document.getElementById('flash').style.opacity=0},350);setTimeout(()=>{attack=false;document.getElementById('log').textContent=enemyHP?'Ход противника...':'Победа! +100 XP';if(enemyHP)enemyTurn()},550)},500)}
function enemyTurn(){setTimeout(()=>{playerHP=Math.max(0,playerHP-10);document.getElementById('hp').style.width=playerHP+'%';document.getElementById('log').textContent=playerHP?'Разбойник атаковал. Ваш ход.':'Поражение — попробуйте снова';},650)}
document.getElementById('atk').onclick=doAttack;document.getElementById('def').onclick=()=>document.getElementById('log').textContent='Защита активна: следующая атака нанесёт меньше урона';
document.getElementById('go').onclick=()=>document.getElementById('log').textContent='Переход в Центральный район 3–5...';
</script>
</body></html>
