name = "territory-sdolars-server"
main = "worker.js"
compatibility_date = "2026-09-19"

[[durable_objects.bindings]]
name = "DB"
class_name = "TerritoryDB"

[[durable_objects.bindings]]
name = "ARENA_HUB"
class_name = "RoomHubSQLite"

[exports.GameHub]
type = "durable-object"
storage = "legacy-kv"

[exports.PresenceHub]
type = "durable-object"
storage = "legacy-kv"

# RoomHub was provisioned as SQLite by the earlier v5 migration.
# Its storage type is immutable, so keep the existing namespace as SQLite.
[exports.RoomHub]
type = "durable-object"
storage = "sqlite"

[exports.TerritoryDB]
type = "durable-object"
storage = "sqlite"

[exports.RoomHubSQLite]
type = "durable-object"
storage = "sqlite"

[triggers]
crons = ["0 3 * * *"]

[observability]
enabled = true
