name = "territory-sdolars-server"
main = "worker.js"
compatibility_date = "2026-09-19"

[[durable_objects.bindings]]
name = "GAME_HUB"
class_name = "GameHub"

[[durable_objects.bindings]]
name = "PRESENCE_HUB"
class_name = "PresenceHub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameHub"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["PresenceHub"]

[observability]
enabled = true
