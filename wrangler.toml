name = "territory-sdolars-server"
main = "worker.js"
compatibility_date = "2026-09-19"

[[durable_objects.bindings]]
name = "DB"
class_name = "TerritoryDB"

[[durable_objects.bindings]]
name = "ARENA_HUB"
class_name = "RoomHubSQLite"

[exports.TerritoryDB]
type = "durable-object"
storage = "sqlite"

# RoomHub was already provisioned by the older deployment as a legacy KV-backed DO.
# Keep it declared so the existing namespace is preserved, but do not bind it.
[exports.RoomHub]
type = "durable-object"
storage = "legacy-kv"

# New Arena namespace: SQLite-backed, compatible with Workers Free.
[exports.RoomHubSQLite]
type = "durable-object"
storage = "sqlite"

[triggers]
crons = ["0 3 * * *"]

[observability]
enabled = true
