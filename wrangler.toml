name = "territory-sdolars-server"
main = "worker.js"
compatibility_date = "2026-09-19"

[[durable_objects.bindings]]
name = "DB"
class_name = "TerritoryDB"

[[durable_objects.bindings]]
name = "ARENA_HUB"
class_name = "RoomHubSQLite"

# Existing legacy Durable Object namespaces.
# Their storage backend is immutable and must remain legacy-kv.
[exports.GameHub]
type = "durable-object"
storage = "legacy-kv"

[exports.PresenceHub]
type = "durable-object"
storage = "legacy-kv"

[exports.RoomHub]
type = "durable-object"
storage = "legacy-kv"

# SQLite-backed database.
[exports.TerritoryDB]
type = "durable-object"
storage = "sqlite"

# New Arena namespace used by ARENA_HUB.
[exports.RoomHubSQLite]
type = "durable-object"
storage = "sqlite"

[triggers]
crons = ["0 3 * * *"]

[observability]
enabled = true
